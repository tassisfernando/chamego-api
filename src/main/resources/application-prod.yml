# Perfil ativo no Render (SPRING_PROFILES_ACTIVE=prod).
spring:
  jmx:
    enabled: false
  main:
    banner-mode: off
    lazy-initialization: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
  datasource:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 20000

management:
  endpoint:
    health:
      show-details: never
  # Evita SELECT de validação no Supabase a cada probe do Render.
  health:
    db:
      enabled: false
    # O Render não alcança smtp.gmail.com:587; o probe levava ~135s e falhava o deploy.
    mail:
      enabled: false

logging:
  level:
    root: WARN
    com.tassisfernando.chamegoapi: INFO