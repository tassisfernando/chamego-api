spring:
  application:
    name: chamego-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chamego}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    # A URL com porta 6543 (pooler Transaction) é reescrita em runtime para 5432
    # (pooler Session). Ver SupabaseDataSourceConfig.
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 20000
      data-source-properties:
        prepareThreshold: 0
        preparedStatementCacheQueries: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

chamego:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  jwt:
    secret: ${JWT_SECRET:chamego-jwt-secret-local-deve-ter-pelo-menos-256-bits-de-entropia!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  operacao:
    data-inicio: 2025-12-01
  notificacao:
    habilitada: ${NOTIFICACOES_HABILITADAS:false}
    canal: ${NOTIFICATION_CHANNEL:LOG}
    owner-email: ${OWNER_NOTIFICATION_EMAIL:}
    owner-whatsapp: ${OWNER_WHATSAPP_NUMBER:+5531989319621}
    owner-name: ${OWNER_NAME:Maressa}
    whatsapp-api-url: ${WHATSAPP_API_URL:}
    whatsapp-api-token: ${WHATSAPP_API_TOKEN:}
    whatsapp-instance: ${WHATSAPP_INSTANCE:}
    whatsapp-provider: ${WHATSAPP_PROVIDER:EVOLUTION}
    digest:
      email-enabled: ${DIGEST_EMAIL_ENABLED:true}
      whatsapp-enabled: ${DIGEST_WHATSAPP_ENABLED:false}
      owner-email: ${OWNER_NOTIFICATION_EMAIL:tsfernando72@gmail.com}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
