spring:
  application:
    name: chamego-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chamego}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

chamego:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  jwt:
    secret: ${JWT_SECRET:chamego-jwt-secret-local-deve-ter-pelo-menos-256-bits-de-entropia!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  operacao:
    data-inicio: 2025-12-01

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
